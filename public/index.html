<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Voice Assistant</h1>
      <div class="header-controls">
        <label class="setting" title="Who turns your speech into text. The browser is free; ElevenLabs uses credits but is more accurate.">
          <span class="setting-label">Hearing</span>
          <select id="hearingSelect">
            <option value="browser">Browser (free)</option>
            <option value="elevenlabs">ElevenLabs</option>
          </select>
        </label>
        <label class="setting" title="Who reads replies aloud. ElevenLabs sounds far better but uses credits; the browser voice is free.">
          <span class="setting-label">Voice</span>
          <select id="voiceSelect">
            <option value="elevenlabs">ElevenLabs</option>
            <option value="browser">Browser (free)</option>
          </select>
        </label>
        <label class="switch" title="Listen continuously and send when you stop talking">
          <input type="checkbox" id="handsFreeToggle">
          <span class="track"><span class="knob"></span></span>
          <span class="switch-label">Hands-free</span>
        </label>
        <button id="newChatBtn" class="ghost-btn">New chat</button>
      </div>
    </header>

    <div id="transcript">
      <p class="empty-state">Press and hold the button to talk.<br>Release when you're done.</p>
    </div>

    <footer>
      <div class="mic-wrap" id="micWrap">
        <div class="pulse"></div>
        <div class="pulse"></div>
        <button id="recordBtn" aria-label="Hold to talk">
          <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg>
        </button>
      </div>
      <div id="status">Ready</div>
      <div class="hint" id="hint">hold the button or <kbd>space</kbd></div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
