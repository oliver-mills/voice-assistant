<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Assistant</title>
  <style>
    /* Page-wide layout: centers everything in a narrow column */
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      text-align: center;
    }
    /* Status line that reports what the app is currently doing */
    #status {
      margin-top: 20px;
      font-size: 18px;
      color: #555;
    }
    button {
      font-size: 16px;
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      background: #333;
      color: white;
      cursor: pointer;
    }
    /* Style applied automatically when the button gets the "disabled" attribute */
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Voice Assistant</h1>
  <button id="recordBtn">Hold to Talk</button>
  <div id="status">Idle</div>

<script>
  // Grab references to the DOM elements we need to read/update
  const recordBtn = document.getElementById('recordBtn');
  const statusEl = document.getElementById('status');

  // mediaRecorder captures audio from the mic; audioChunks collects the
  // small pieces of data it hands us while recording is in progress
  let mediaRecorder;
  let audioChunks = [];

  // The button doubles as both "start" and "stop" control. We tell which
  // mode we're in by checking its current label text.
  recordBtn.addEventListener('click', async () => {
    if (recordBtn.textContent === 'Hold to Talk') {
      // --- Start recording ---
      try {
        // Ask the browser for microphone access (triggers a permission
        // prompt the first time). This is async because the user has to
        // approve it, and it can also fail (denied, no mic, etc.).
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        // Fires repeatedly while recording, handing us chunks of audio data
        mediaRecorder.ondataavailable = (event) => {
          audioChunks.push(event.data);
        };

        // Fires once recording stops; combine all chunks into one audio file (Blob)
        mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            statusEl.textContent = 'Transcribing...';

            const formData = new FormData();
            formData.append('file', audioBlob, 'recording.webm');

            try {
                const response = await fetch('/api/speech-to-text', {
                method: 'POST',
                body: formData
                });

                const sstData = await response.json();
                console.log('STT response:', sstData);
                statusEl.textContent = `You said: "${sstData.text}"`;

                statusEl.textContent += ' — thinking...';

                const chatResponse = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: sstData.text })
                });
                
                const chatData = await chatResponse.json();
                console.log('Chat response:', chatData);
                statusEl.textContent = `Chat says: "${chatData.reply}" — speaking...`;

                // Ask the server to synthesize speech, then play the returned audio
                const ttsResponse = await fetch('/api/text-to-speech', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: chatData.reply })
                });

                // The response body is raw audio bytes (a Blob), not JSON;
                // createObjectURL turns that Blob into a URL the <audio> tag can play
                const ttsBlob = await ttsResponse.blob();
                const audioUrl = URL.createObjectURL(ttsBlob);
                const audio = new Audio(audioUrl);
                audio.play();

                // Wait for playback to finish before updating the status text,
                // so the "speaking..." message stays up for the full reply
                audio.onended = () => {
                statusEl.textContent = `Chat says: "${chatData.reply}"`;
                };
            } catch (err) {
                statusEl.textContent = 'Transcription failed';
                console.error(err);
            }
        };

        mediaRecorder.start();
        statusEl.textContent = 'Listening...';
        recordBtn.textContent = 'Stop'; // flips the button into "stop" mode
      } catch (err) {
        // Happens if the user denies mic permission or no mic is available
        statusEl.textContent = 'Mic permission denied or unavailable';
        console.error(err);
      }
    } else {
      // --- Stop recording ---
      // This triggers the 'onstop' handler above, which builds the audio Blob
      mediaRecorder.stop();
      recordBtn.textContent = 'Hold to Talk'; // flip back to "start" mode
    }
  });
</script>
</body>
</html>
