<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Assistant</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      text-align: center;
    }
    #status {
      margin-top: 20px;
      font-size: 18px;
      color: #555;
    }
    button {
      font-size: 16px;
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      background: #333;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Voice Assistant</h1>
  <button id="recordBtn">Hold to Talk</button>
  <div id="status">Idle</div>

  <script>
    const recordBtn = document.getElementById('recordBtn');
    const statusEl = document.getElementById('status');

    recordBtn.addEventListener('click', () => {
      statusEl.textContent = 'Button clicked!';
    });
  </script>
</body>
</html>
