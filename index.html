<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Assistant</title>
  <style>
    /* One palette defined here, overridden wholesale for dark mode below, so
       no rule further down needs to know which theme is active */
    :root {
      color-scheme: light dark;
      --bg: #f4f5f8;
      --panel: #ffffff;
      --border: #e4e6ec;
      --text: #14161c;
      --muted: #6b7280;
      --accent: #2f6df6;
      --user-bubble: #2f6df6;
      --user-text: #ffffff;
      --bot-bubble: #eef0f5;
      --bot-text: #14161c;
      --danger: #b3261e;
      --danger-bg: #fdeceb;
      --danger-border: #f5c6c2;
      --rec: #e5484d;
      --shadow: 0 1px 2px rgba(16, 18, 29, .05), 0 10px 30px rgba(16, 18, 29, .07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1015;
        --panel: #15181f;
        --border: #262b35;
        --text: #e6e8ee;
        --muted: #99a0ac;
        --accent: #5b8dff;
        --user-bubble: #2f6df6;
        --bot-bubble: #212632;
        --bot-text: #e6e8ee;
        --danger: #ff9d95;
        --danger-bg: #351d1c;
        --danger-border: #59302d;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    /* The app is one fixed-height card: header and footer stay put while only
       the transcript in between scrolls */
    .app {
      width: 100%;
      max-width: 680px;
      height: 100%;
      max-height: 820px;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -.01em;
    }

    .ghost-btn {
      font: inherit;
      font-size: 13px;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .ghost-btn:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
    .ghost-btn:disabled { opacity: .45; cursor: not-allowed; }

    #transcript {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    /* Shown only while the transcript has no messages; .has-messages on the
       container hides it without needing to remove the node */
    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      max-width: 280px;
    }
    #transcript.has-messages .empty-state { display: none; }

    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      animation: rise .18s ease-out;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 5px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--bot-bubble);
      color: var(--bot-text);
      border-bottom-left-radius: 5px;
    }
    .msg.error {
      align-self: center;
      max-width: 90%;
      text-align: center;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
      font-size: 13.5px;
    }

    /* Replay control, tucked under an assistant bubble once its audio exists */
    .replay {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      font: inherit;
      font-size: 12px;
      color: var(--muted);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    .replay:hover { color: var(--text); }
    .replay svg { width: 12px; height: 12px; fill: currentColor; }

    /* Three-dot placeholder while a turn is still being fetched */
    .dots { display: inline-flex; gap: 4px; padding: 3px 0; }
    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: .35;
      animation: blink 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .18s; }
    .dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes blink {
      0%, 60%, 100% { opacity: .25; }
      30%           { opacity: .9; }
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 18px 20px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .mic-wrap { position: relative; display: grid; place-items: center; }

    #recordBtn {
      position: relative;
      z-index: 1;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .12s ease, background .2s ease;
      touch-action: none; /* stop mobile from scrolling instead of press-holding */
      -webkit-user-select: none;
      user-select: none;
    }
    #recordBtn svg { width: 26px; height: 26px; fill: currentColor; pointer-events: none; }
    #recordBtn:hover:not(:disabled) { transform: scale(1.04); }
    #recordBtn:disabled { background: var(--muted); cursor: not-allowed; opacity: .6; }
    #recordBtn.recording { background: var(--rec); transform: scale(1.06); }

    /* Expanding ring behind the button, rendered only while recording */
    .pulse {
      position: absolute;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--rec);
      opacity: 0;
    }
    .mic-wrap.recording .pulse { animation: pulse 1.5s ease-out infinite; }
    .mic-wrap.recording .pulse:nth-child(2) { animation-delay: .5s; }
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: .35; }
      100% { transform: scale(2.1); opacity: 0; }
    }

    #status {
      font-size: 13.5px;
      color: var(--muted);
      min-height: 20px;
      text-align: center;
    }
    #status.live { color: var(--rec); font-variant-numeric: tabular-nums; }

    .hint { font-size: 11.5px; color: var(--muted); opacity: .75; }
    .hint kbd {
      font: inherit;
      font-size: 10.5px;
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 4px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Voice Assistant</h1>
      <button id="newChatBtn" class="ghost-btn">New chat</button>
    </header>

    <div id="transcript">
      <p class="empty-state">Press and hold the button to talk.<br>Release when you're done.</p>
    </div>

    <footer>
      <div class="mic-wrap" id="micWrap">
        <div class="pulse"></div>
        <div class="pulse"></div>
        <button id="recordBtn" aria-label="Hold to talk">
          <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg>
        </button>
      </div>
      <div id="status">Ready</div>
      <div class="hint">hold the button or <kbd>space</kbd></div>
    </footer>
  </div>

<script>
  const transcript = document.getElementById('transcript');
  const recordBtn = document.getElementById('recordBtn');
  const micWrap = document.getElementById('micWrap');
  const statusEl = document.getElementById('status');
  const newChatBtn = document.getElementById('newChatBtn');

  // mediaRecorder captures audio from the mic; audioChunks collects the small
  // pieces of data it hands us while recording is in progress. mediaStream is
  // kept so its tracks can be released the moment recording ends, which is what
  // turns the browser's recording indicator back off.
  let mediaRecorder;
  let mediaStream;
  let audioChunks = [];

  let isRecording = false;
  let wantsToRecord = false; // set on press, cleared on release
  let isBusy = false;        // true while a turn is in flight
  let startedAt = 0;
  let timerId;
  let currentAudio;          // so a new turn can cut off the previous reply
  const audioUrls = [];      // object URLs to revoke when the transcript clears

  // Anything shorter than this is almost always an accidental tap
  const MIN_RECORDING_MS = 400;

  // ---------- transcript rendering ----------

  function scrollToBottom() {
    transcript.scrollTop = transcript.scrollHeight;
  }

  // Returns a small handle rather than the raw node, so callers can fill in or
  // replace a bubble later without re-querying the DOM
  function addMessage(role, text, { pending = false } = {}) {
    const el = document.createElement('div');
    el.className = `msg ${role}`;

    if (pending) {
      el.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    } else {
      el.textContent = text;
    }

    transcript.appendChild(el);
    transcript.classList.add('has-messages');
    scrollToBottom();

    return {
      el,
      setText(value) {
        el.textContent = value;
        scrollToBottom();
      },
      // Converts an in-flight bubble into an inline error instead of leaving a
      // spinner stranded on the screen
      fail(message) {
        el.className = 'msg error';
        el.textContent = message;
        scrollToBottom();
      },
      remove() {
        el.remove();
      },
      attachAudio(url) {
        const button = document.createElement('button');
        button.className = 'replay';
        button.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Replay';
        button.addEventListener('click', () => playAudio(url));
        el.appendChild(document.createElement('br'));
        el.appendChild(button);
        scrollToBottom();
      }
    };
  }

  function addError(message) {
    addMessage('error', message);
  }

  // ---------- status ----------

  function setStatus(text, { live = false } = {}) {
    statusEl.textContent = text;
    statusEl.classList.toggle('live', live);
  }

  function setBusy(value) {
    isBusy = value;
    recordBtn.disabled = value;
    newChatBtn.disabled = value;
  }

  // ---------- api calls ----------

  // The server reports failures as {error: "..."}; surface that text rather
  // than a bare status code so the cause is visible in the transcript
  async function postJSON(url, body) {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(data.error || `Request failed (${response.status})`);
    }
    return data;
  }

  async function transcribe(blob, filename) {
    const formData = new FormData();
    formData.append('file', blob, filename);

    const response = await fetch('/api/speech-to-text', { method: 'POST', body: formData });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(data.error || `Transcription failed (${response.status})`);
    }
    return data.text;
  }

  async function synthesize(text) {
    const response = await fetch('/api/text-to-speech', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });

    // Success is raw audio bytes; failure is JSON, so only parse on failure
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(data.error || `Text-to-speech failed (${response.status})`);
    }

    // createObjectURL turns the Blob into a URL the Audio element can play
    return URL.createObjectURL(await response.blob());
  }

  function playAudio(url) {
    if (currentAudio) currentAudio.pause();
    currentAudio = new Audio(url);
    return currentAudio.play().then(
      () => new Promise((resolve) => { currentAudio.onended = resolve; }),
      () => {} // autoplay can be blocked; the replay button still works
    );
  }

  // ---------- the turn pipeline ----------

  async function runTurn(blob, filename) {
    setBusy(true);
    if (currentAudio) currentAudio.pause();

    const userMsg = addMessage('user', '', { pending: true });
    setStatus('Transcribing...');

    let text;
    try {
      text = await transcribe(blob, filename);
      userMsg.setText(text);
    } catch (err) {
      // Nothing was said, so drop the empty bubble rather than showing a blank
      userMsg.remove();
      addError(err.message);
      console.error(err);
      setBusy(false);
      setStatus('Ready');
      return;
    }

    const botMsg = addMessage('assistant', '', { pending: true });
    setStatus('Thinking...');

    let reply;
    try {
      reply = (await postJSON('/api/chat', { text })).reply;
      botMsg.setText(reply);
    } catch (err) {
      botMsg.fail(err.message);
      console.error(err);
      setBusy(false);
      setStatus('Ready');
      return;
    }

    // The reply is already on screen at this point, so a speech failure is a
    // note on the turn rather than a failure of it
    setStatus('Speaking...');
    try {
      const url = await synthesize(reply);
      audioUrls.push(url);
      botMsg.attachAudio(url);
      await playAudio(url);
    } catch (err) {
      addError(err.message);
      console.error(err);
    }

    setBusy(false);
    setStatus('Ready');
  }

  // ---------- recording ----------

  // Safari doesn't support webm, so ask the browser what it can actually record
  function pickMimeType() {
    const candidates = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/mp4',
      'audio/ogg;codecs=opus'
    ];
    return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || '';
  }

  function releaseStream() {
    if (mediaStream) {
      // Without this the browser keeps showing the "recording" indicator
      mediaStream.getTracks().forEach((track) => track.stop());
      mediaStream = null;
    }
  }

  function startTimer() {
    startedAt = Date.now();
    timerId = setInterval(() => {
      const seconds = ((Date.now() - startedAt) / 1000).toFixed(1);
      setStatus(`Listening  ${seconds}s`, { live: true });
    }, 100);
  }

  async function startRecording() {
    if (isRecording || isBusy || wantsToRecord) return;
    wantsToRecord = true;

    try {
      // Triggers a permission prompt the first time, and can fail if the user
      // denies it or there is no mic
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

      // The button may already have been released while we were waiting
      if (!wantsToRecord) {
        stream.getTracks().forEach((track) => track.stop());
        return;
      }

      mediaStream = stream;
      const mimeType = pickMimeType();
      mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      audioChunks = [];

      // Fires repeatedly while recording, handing us chunks of audio data
      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) audioChunks.push(event.data);
      };

      // Fires once recording stops; combine all chunks into one audio file
      mediaRecorder.onstop = () => {
        const elapsed = Date.now() - startedAt;
        const type = mediaRecorder.mimeType || 'audio/webm';
        releaseStream();

        if (elapsed < MIN_RECORDING_MS || audioChunks.length === 0) {
          setStatus('Hold a moment longer');
          setTimeout(() => { if (!isRecording && !isBusy) setStatus('Ready'); }, 1600);
          return;
        }

        const blob = new Blob(audioChunks, { type });
        // The extension has to match the container or the API rejects it
        const filename = type.includes('mp4') ? 'recording.mp4'
                       : type.includes('ogg') ? 'recording.ogg'
                       : 'recording.webm';
        runTurn(blob, filename);
      };

      mediaRecorder.start();
      isRecording = true;
      micWrap.classList.add('recording');
      recordBtn.classList.add('recording');
      startTimer();
    } catch (err) {
      wantsToRecord = false;
      releaseStream();
      setStatus('Ready');
      addError('Mic permission denied or unavailable');
      console.error(err);
    }
  }

  function stopRecording() {
    wantsToRecord = false;
    if (!isRecording) return;

    isRecording = false;
    clearInterval(timerId);
    micWrap.classList.remove('recording');
    recordBtn.classList.remove('recording');
    setStatus('Processing...');

    // Triggers the onstop handler above, which builds the audio Blob
    mediaRecorder.stop();
  }

  // ---------- input wiring ----------

  recordBtn.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    startRecording();
  });

  // Listening on the window rather than the button means dragging off the
  // button mid-sentence still ends the recording cleanly on release
  window.addEventListener('pointerup', stopRecording);
  window.addEventListener('pointercancel', stopRecording);

  window.addEventListener('keydown', (event) => {
    if (event.code === 'Space' && !event.repeat) {
      event.preventDefault();
      startRecording();
    }
  });
  window.addEventListener('keyup', (event) => {
    if (event.code === 'Space') {
      event.preventDefault();
      stopRecording();
    }
  });

  newChatBtn.addEventListener('click', async () => {
    if (currentAudio) currentAudio.pause();
    try {
      await postJSON('/api/reset', {});
    } catch (err) {
      addError(err.message);
      return;
    }
    // Each reply's audio was held in memory behind an object URL; nothing can
    // reach them once the transcript is gone, so hand the memory back
    audioUrls.splice(0).forEach((url) => URL.revokeObjectURL(url));

    // Rebuild the empty state from scratch so the placeholder comes back
    transcript.innerHTML = '<p class="empty-state">Press and hold the button to talk.<br>Release when you\'re done.</p>';
    transcript.classList.remove('has-messages');
    setStatus('Ready');
  });
</script>
</body>
</html>
